name: Publish release

on:
  pull_request:
  push:
    branches:
      - main
      - feat/isecc-129-campus-segmentation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v6

      - name: Validate scripts
        run: |
          bash -n install.sh start.sh agentctl tests/test-host-tools.sh
          tests/test-host-tools.sh

  release:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v6

      - name: Generate release checksums
        run: sha256sum install.sh QUICKSTART.md start.sh agentctl docker-compose.yml > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            channel="stable"
          else
            channel="campus-beta"
          fi
          tag="${channel}-${GITHUB_SHA::12}"
          gh release create "${tag}" \
            install.sh \
            QUICKSTART.md \
            start.sh \
            agentctl \
            docker-compose.yml \
            SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --latest=false

          if [[ "${channel}" == "stable" ]]; then
            gh release edit "${tag}" --latest
          fi
