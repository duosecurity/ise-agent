name: Publish release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v6

      - name: Validate scripts
        run: |
          bash -n install.sh start.sh agentctl tests/test-host-tools.sh
          tests/test-host-tools.sh

  release:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v6

      - name: Generate release checksums
        run: sha256sum install.sh README.md start.sh agentctl docker-compose.yml > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-${GITHUB_SHA::12}"
          gh release create "${tag}" \
            install.sh \
            README.md \
            start.sh \
            agentctl \
            docker-compose.yml \
            SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --latest=false

          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "${main_sha}" == "${GITHUB_SHA}" ]]; then
            gh release edit "${tag}" --latest
          fi
